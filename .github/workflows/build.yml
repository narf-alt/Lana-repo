name: Build Lana Repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git gnupg dpkg python3-pip xz-utils

      - name: Clone Silex
        run: |
          git clone https://github.com/5hux1n/Silex.git silex

      - name: Fix Silex DebianPackager
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("silex/util/DebianPackager.py")
          text = path.read_text()

          patterns = [
              r"^[ \t]*subprocess\.run\(\['mv', control_tar\.replace\('\.gz', ''\), 'control\.tar'\], cwd=tmpdir, check=True\)[ \t]*\n",
              r"^[ \t]*subprocess\.run\(\['mv', control_tar\.replace\('\.xz', ''\), 'control\.tar'\], cwd=tmpdir, check=True\)[ \t]*\n",
              r"^[ \t]*subprocess\.run\(\['mv', 'control\.tar\.gz', control_tar\], cwd=tmpdir, check=True\)[ \t]*\n",
              r"^[ \t]*subprocess\.run\(\['mv', 'control\.tar\.xz', control_tar\], cwd=tmpdir, check=True\)[ \t]*\n",
          ]

          for pattern in patterns:
              text, count = re.subn(pattern, "", text, flags=re.MULTILINE)
              print(f"Removed {count} matching command(s).")

          path.write_text(text)
          PY

          echo "Checking DebianPackager.py syntax..."
          python3 -m py_compile silex/util/DebianPackager.py

          echo "Checking for remaining broken mv commands..."
          if grep -nE "mv.*control_tar|mv.*control\.tar\.(gz|xz).*control_tar" silex/util/DebianPackager.py; then
            echo "ERROR: Broken control.tar mv command still exists."
            exit 1
          fi

          echo "Silex DebianPackager fixed successfully."

      - name: Install Python dependencies
        run: |
          python3 -m pip install --break-system-packages -r silex/requirements.txt

      - name: Copy repository files
        run: |
          cp -r Packages silex/
          cp -r Styles silex/

      - name: Build with Silex
        run: |
          cd silex
          python3 index.py

      - name: Fix Release architectures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          release = Path("silex/docs/Release")
          text = release.read_text()

          old = "Architectures: iphoneos-arm64"
          new = "Architectures: iphoneos-arm64 iphoneos-arm64e"

          if old not in text:
              raise SystemExit("Could not find the Architectures line in Release.")

          text = text.replace(old, new, 1)
          release.write_text(text)

          print("Release architectures fixed:")
          print("Architectures: iphoneos-arm64 iphoneos-arm64e")
          PY

      - name: Add uncompressed Packages file
        run: |
          xz -d -c silex/docs/Packages.xz > silex/docs/Packages

      - name: Copy generated repository
        run: |
          rm -rf docs
          cp -r silex/docs docs

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Build Lana repo with Silex"
          git push

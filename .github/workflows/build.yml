name: Build Lana Repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git gnupg dpkg python3-pip xz-utils

      - name: Clone Silex
        run: |
          git clone https://github.com/5hux1n/Silex.git silex

      - name: Fix Silex DebianPackager
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("silex/util/DebianPackager.py")
          s = p.read_text()

          old_gz = """        elif control_tar.endswith('.gz'):
              subprocess.run(['gunzip', '-k', control_tar], cwd=tmpdir, check=True)
              subprocess.run(['mv', control_tar.replace('.gz', ''), 'control.tar'], cwd=tmpdir, check=True)
          """

          new_gz = """        elif control_tar.endswith('.gz'):
              subprocess.run(['gunzip', '-k', control_tar], cwd=tmpdir, check=True)
          """

          old_xz = """        elif control_tar.endswith('.xz'):
              subprocess.run(['unxz', '-k', control_tar], cwd=tmpdir, check=True)
              subprocess.run(['mv', control_tar.replace('.xz', ''), 'control.tar'], cwd=tmpdir, check=True)
          """

          new_xz = """        elif control_tar.endswith('.xz'):
              subprocess.run(['unxz', '-k', control_tar], cwd=tmpdir, check=True)
          """

          if old_gz in s:
              s = s.replace(old_gz, new_gz)

          if old_xz in s:
              s = s.replace(old_xz, new_xz)

          p.write_text(s)

          print("Silex DebianPackager fixed successfully.")
          PY

      - name: Install Python dependencies
        run: |
          python3 -m pip install --break-system-packages -r silex/requirements.txt

      - name: Copy repository files
        run: |
          cp -r Packages silex/
          cp -r Styles silex/

      - name: Build with Silex
        run: |
          cd silex
          python3 index.py

      - name: Add uncompressed Packages file
        run: |
          xz -d -c silex/docs/Packages.xz > silex/docs/Packages

      - name: Copy generated repository
        run: |
          rm -rf docs
          cp -r silex/docs docs

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Build Lana repo with Silex"
          git push

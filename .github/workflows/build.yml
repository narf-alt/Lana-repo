name: Build Lana Repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git gnupg dpkg python3-pip xz-utils

      - name: Clone Silex
        run: |
          git clone https://github.com/5hux1n/Silex.git silex

      - name: Fix Silex DebianPackager
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("silex/util/DebianPackager.py")
          text = path.read_text()

          text = re.sub(
              r"^[ \t]*subprocess\.run\(\['mv', control_tar\.replace\('\.gz', ''\), 'control\.tar'\], cwd=tmpdir, check=True\)[ \t]*\n",
              "",
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r"^[ \t]*subprocess\.run\(\['mv', control_tar\.replace\('\.xz', ''\), 'control\.tar'\], cwd=tmpdir, check=True\)[ \t]*\n",
              "",
              text,
              flags=re.MULTILINE
          )

          path.write_text(text)

          print("Checking patched DebianPackager.py...")
          PY

          python3 -m py_compile silex/util/DebianPackager.py

          echo "Silex DebianPackager syntax check passed."

          echo "Remaining problematic mv commands:"
          grep -n "control_tar.replace" silex/util/DebianPackager.py || true

      - name: Install Python dependencies
        run: |
          python3 -m pip install --break-system-packages -r silex/requirements.txt

      - name: Copy repository files
        run: |
          cp -r Packages silex/
          cp -r Styles silex/

      - name: Build with Silex
        run: |
          cd silex
          python3 index.py

      - name: Add uncompressed Packages file
        run: |
          xz -d -c silex/docs/Packages.xz > silex/docs/Packages

      - name: Copy generated repository
        run: |
          rm -rf docs
          cp -r silex/docs docs

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Build Lana repo with Silex"
          git push
